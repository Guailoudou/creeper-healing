name: Build 26.3

on:
  push:
    branches: [ "26.3-port" ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout creeper-healing
        uses: actions/checkout@v4

      - name: Checkout monkey-utils (26.3 port)
        uses: actions/checkout@v4
        with:
          repository: Guailoudou/monkey-utils-port
          path: deps/monkey-utils

      - name: Checkout fabric-permissions-api (26.3 port)
        uses: actions/checkout@v4
        with:
          repository: Guailoudou/fabric-permissions-api-port
          path: deps/fabric-permissions-api

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'

      - name: Install Gradle 9.8.0
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '9.8.0'

      - name: Build fabric-permissions-api
        run: |
          cd deps/fabric-permissions-api
          gradle publishToMavenLocal --no-daemon -x test

      - name: Build monkey-utils
        run: |
          cd deps/monkey-utils
          gradle publishToMavenLocal --no-daemon -x test

      - name: Build creeper-healing
        run: gradle build --no-daemon -x test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: creeperhealing-26.3
          path: build/libs/*.jar
          if-no-files-found: error
